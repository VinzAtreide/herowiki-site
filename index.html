<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1117">
<!-- Le site n'a besoin de rien d'extérieur : on l'interdit. Une extension
     douteuse ou un contenu injecté ne peut ni charger ni exécuter ailleurs. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self'; base-uri 'none'; object-src 'none'">
<title>HeroWiki</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9889;</text></svg>">
</head>
<body>

<!-- ─────────────────────────────── écran de déverrouillage ─────────────── -->
<div id="porte">
  <form id="porte-form" autocomplete="off">
    <div class="eclair">⚡</div>
    <h1 id="porte-titre">HeroWiki</h1>
    <p id="porte-sous" class="sous"></p>
    <div class="champ">
      <input id="phrase" type="password" inputmode="text" autocapitalize="none"
             autocorrect="off" spellcheck="false" autocomplete="current-password"
             placeholder="ta phrase de passe">
      <button id="voirph" type="button" class="ico" title="Afficher la phrase">👁</button>
    </div>
    <button id="porte-ok" type="submit">Entrer</button>
    <label class="memo"><input type="checkbox" id="memo" checked> Se souvenir de moi sur cet appareil</label>
    <p id="porte-msg" class="msg"></p>
  </form>
</div>

<!-- ── le sas : l'animation d'ouverture des archives, à la connexion ───── -->
<div id="sas" hidden>
  <div class="sas-in">
    <div class="eclair">⚡</div>
    <div id="sas-lignes"></div>
    <div class="sas-barre"><div id="sas-jauge"></div></div>
  </div>
</div>

<!-- ─────────────────────────────────────────────── application ─────────── -->
<div id="app" hidden>

  <header id="barre">
    <button id="menu" class="ico" title="Menu">☰</button>
    <button id="retour" class="ico" title="Retour" hidden>←</button>
    <a id="logo" href="#/">⚡ <span></span></a>
    <div id="chercher">
      <input id="q" type="search" placeholder="Chercher…" autocapitalize="none"
             autocorrect="off" spellcheck="false">
      <button id="q-vider" class="ico" hidden>✕</button>
    </div>
    <button id="mj-btn" class="ico" title="Page MJ" hidden>🛠</button>
    <button id="qui" class="ico" title="Mon accès">●</button>
  </header>

  <nav id="cote">
    <div class="cote-in">
      <div class="grp" id="rayons"></div>
      <div class="grp">
        <h4>Filtrer</h4>
        <input id="filtre" type="search" placeholder="dans la liste…" autocapitalize="none">
        <div id="types"></div>
      </div>
      <div class="grp" id="bloc-tags">
        <h4>Étiquettes</h4>
        <div id="tags"></div>
      </div>
    </div>
  </nav>
  <div id="voile"></div>

  <main id="vue"></main>
  <footer id="pied"><span id="compteur"></span></footer>
</div>

<script src="app.js"></script>
<script src="mj.js"></script>
</body>
</html>
